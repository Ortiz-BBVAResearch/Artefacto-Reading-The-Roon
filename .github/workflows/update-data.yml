name: Update public data

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests openpyxl xlrd
      - name: Pull FRED, GPR and EPU and refresh data.json
        run: python scripts/update_public_data.py data.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json update_log.md
            git commit -m "data: public series refreshed $(date -u +%F)"
            git push
          else
            echo "No change in data.json"
          fi
